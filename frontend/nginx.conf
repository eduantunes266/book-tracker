server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # Covers can be up to 5 MB (nginx's default limit is only 1 MB)
    client_max_body_size 6m;

    # Same job as the Vite proxy in development:
    # API requests and cover images go to the backend container
    location /api/ {
        proxy_pass http://backend:5000;
    }

    location /uploads/ {
        proxy_pass http://backend:5000;
    }

    # React Router: any other URL (e.g. /login, /books/new) loads index.html
    location / {
        try_files $uri $uri/ /index.html;
    }
}
